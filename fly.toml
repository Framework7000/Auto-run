# Fly.io app config. `app` gets overwritten to your actual app name by
# `fly launch` — the placeholder below is fine to leave as-is.
app = "auto-run"
primary_region = "iad"

[build]

[env]
  PORT = "4173"

[[mounts]]
  # Everything under /app/data — browser login sessions, the task db,
  # the Google credential file — must persist across deploys, or every
  # `fly deploy` would wipe every logged-in session.
  source = "auto_run_data"
  destination = "/app/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = false   # a stopped machine drops its logged-in
                                # browser session state mid-task; keep it running
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Chromium is memory-hungry — the smallest Fly VM size will OOM under
  # a real ChatGPT/Claude page load.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
