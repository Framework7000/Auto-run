<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto-Run</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>Auto-Run</h1>
      <p class="subtitle">One task in. The right agents work it. One thread back.</p>
    </div>
    <div class="export-buttons">
      <a href="/api/tasks/export/md" target="_blank">Report (.md)</a>
      <a href="/api/tasks/export/json" target="_blank">Report (.json)</a>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <section class="panel">
        <h2>Sheet</h2>
        <form id="sync-form">
          <label>Google Sheet ID or URL
            <input type="text" id="f-sheet" placeholder="docs.google.com/spreadsheets/d/..." />
          </label>
          <button type="submit">Pull pending tasks</button>
        </form>
        <p class="hint" id="sheet-status">Checking credentials…</p>
      </section>

      <section class="panel">
        <h2>New task</h2>
        <form id="task-form">
          <label>Task
            <textarea id="f-description" rows="3" placeholder="What needs doing?" required></textarea>
          </label>
          <label>Platforms <span class="hint">(comma separated, in order)</span>
            <input type="text" id="f-platforms" placeholder="Claude, ChatGPT" />
          </label>
          <button type="submit">Add task</button>
        </form>
      </section>

      <section class="panel">
        <h2>Council</h2>
        <div id="agents-list" class="agents-list"></div>
      </section>
    </aside>

    <section class="panel tasks-panel">
      <h2>Tasks</h2>
      <div id="tasks-list"></div>
    </section>
  </main>

  <div id="detail-overlay" class="overlay hidden">
    <div class="detail-panel">
      <button id="close-detail" class="close-btn">&times;</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
